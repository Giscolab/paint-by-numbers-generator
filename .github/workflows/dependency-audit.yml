name: Dependency audit

on:
  push:
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: npm vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      # npm audit reads the committed lockfile; no dependency scripts are run.
      # Both runtime and development dependencies are included. High/critical
      # findings fail the job; lower-severity findings remain in the artifact.
      - name: Audit the dependency lockfile
        run: npm audit --audit-level=high --json > npm-audit.json
      - name: Preserve vulnerability report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-audit
          path: npm-audit.json
          if-no-files-found: warn
          retention-days: 14
